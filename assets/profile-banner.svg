<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">March.7th</title>
  <desc id="description">A dark green profile banner with a quiet waveform and the words building calm tools for music and creativity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d" />
      <stop offset="0.55" stop-color="#0d1117" />
      <stop offset="1" stop-color="#071a10" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636" stop-opacity="0" />
      <stop offset="0.35" stop-color="#3fb950" />
      <stop offset="0.7" stop-color="#56d364" />
      <stop offset="1" stop-color="#2ea043" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.26" />
      <stop offset="1" stop-color="#39d353" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2ea043" stroke-opacity="0.075" />
    </pattern>
    <filter id="soft-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <circle cx="1040" cy="35" r="270" fill="url(#glow)" />
  <circle cx="155" cy="345" r="250" fill="url(#glow)" opacity="0.55" />

  <path d="M0 227 C105 227 105 214 170 214 S250 246 330 246 S420 182 500 182 S575 236 660 236 S750 203 830 203 S915 225 1200 225" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.58" filter="url(#soft-glow)" />
  <path d="M0 238 C140 238 155 232 225 232 S330 255 405 255 S510 214 590 214 S690 244 780 244 S920 232 1200 232" fill="none" stroke="#39d353" stroke-width="1" opacity="0.2" />

  <g transform="translate(86 78)">
    <circle cx="9" cy="10" r="5" fill="#39d353" />
    <text x="27" y="17" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="3">HELLO, I AM</text>
    <text x="0" y="94" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2">March.7th</text>
    <text x="3" y="139" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" letter-spacing="0.5">building calm tools for music &amp; creativity</text>
  </g>

  <g transform="translate(945 245)" fill="#39d353">
    <rect x="0" y="24" width="13" height="13" rx="3" opacity="0.24" />
    <rect x="22" y="14" width="13" height="13" rx="3" opacity="0.42" />
    <rect x="44" y="4" width="13" height="13" rx="3" opacity="0.62" />
    <rect x="66" y="19" width="13" height="13" rx="3" opacity="0.82" />
    <rect x="88" y="0" width="13" height="13" rx="3" />
    <rect x="110" y="11" width="13" height="13" rx="3" opacity="0.72" />
    <rect x="132" y="25" width="13" height="13" rx="3" opacity="0.34" />
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#3fb950" stroke-opacity="0.16" />
</svg>
